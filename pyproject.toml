[project]
name = "faue-core"
version = "0.1.0"
description = "Shared runtime plumbing for FAUE services"
requires-python = ">=3.12"

# Declared here, not only in `requirements/`. Those files describe what a
# *service* installs; this is what `pip install faue-core` must pull on its own.
#
# Without it the package installs cleanly and fails at import — which is exactly
# what happens on a container build, where no sibling checkout has already put
# pydantic in the environment.
#
# Unpinned: `requirements/constraints.txt` is where versions are decided, and
# pinning in two places is how they disagree.
dependencies = [
    # Declared here, not only in `requirements/`. Those files describe what a
    # *service* installs; this is what `pip install faue-core` must pull on its
    # own. Without it the package installs cleanly and fails at import — which
    # is what happens on a container build, where no sibling checkout has
    # already put pydantic in the environment.
    #
    # Unpinned: `requirements/constraints.txt` decides versions, and pinning in
    # two places is how they disagree.

    # --- what faue_core itself imports ---
    # `[email]` is load-bearing: EmailStr raises ImportError at model definition
    # without email-validator, so a service fails to start rather than degrade.
    "pydantic[email]>=2",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "cryptography",
    "pyotp",
    "python-dotenv",

    # --- the serving baseline, deliberately NOT an extra ---
    #
    # These were in a `web` extra. Every service then had to remember
    # `faue-core[web]`, and forgetting it produced `bash: uvicorn: command not
    # found` at container start — an error that says nothing about a missing
    # extra and cost a deployment to diagnose.
    #
    # They total a few tens of megabytes. The extra that genuinely matters for
    # image size is `media` (~2GB of models), and that one is still opt-in.
    # Splitting these bought nothing and cost a class of silent failure.
    "fastapi",
    "uvicorn[standard]",
    "asyncpg",
    "alembic",
    "redis",
    "pyjwt",
    "httpx",
    "pyyaml",
    "structlog",
    "python-multipart",
    "sse-starlette",
    "jinja2",
    "aio-pika",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
]

[project.optional-dependencies]
# Only one extra now, and it is the one that earns its keep: the image PII
# pipeline carries roughly 2GB of models, and keeping that out of every API
# instance is a real saving rather than tidiness.
#
# The previous `service` / `web` / `worker` extras were removed. They saved tens
# of megabytes and cost a deployment, because forgetting one produced a missing
# binary rather than a missing package.
#
# Kept as aliases so an existing `faue-core[web]` pin still resolves rather than
# failing on an unknown extra.
web = []
service = []
worker = ["arq"]
broker = []

media = [
    "arq",
    "pillow",
    "mediapipe",
    "pytesseract",
    "open-clip-torch",
    "torch",
    "boto3",
]

[tool.setuptools.packages.find]
include = ["faue_core*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["faue_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
