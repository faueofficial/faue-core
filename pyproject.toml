[project]
name = "faue-core"
version = "0.1.0"
description = "Shared runtime plumbing for FAUE services"
requires-python = ">=3.12"

# Declared here, not only in `requirements/`. Those files describe what a
# *service* installs; this is what `pip install faue-core` must pull on its own.
#
# Without it the package installs cleanly and fails at import — which is exactly
# what happens on a container build, where no sibling checkout has already put
# pydantic in the environment.
#
# Unpinned: `requirements/constraints.txt` is where versions are decided, and
# pinning in two places is how they disagree.
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "cryptography",
    "pyotp",
    "python-dotenv",
]

[project.optional-dependencies]
# These mirror the roles in `requirements/`, which exist for pip-compile and
# pinning. Extras are what pip can resolve at install time, when a container
# build has no access to those files — the two must agree, and `requirements/`
# is the place versions are decided.
#
# Each extra lists its full set rather than building on another. Self-reference
# (`faue-core[service]` inside `web`) is the obvious way to write this and it
# breaks every install from a git URL: the self-reference carries no URL, so pip
# looks up a bare `faue-core` on PyPI and reports
#
#     ERROR: Could not find a version that satisfies the requirement faue-core
#            (from versions: none)
#
# which reads like a missing package and is actually a self-reference that pip
# cannot resolve back to the URL it is already installing from. Duplication here
# is the cost of being installable from git.

broker = ["aio-pika"]

# Everything a FAUE service needs, whatever its role.
service = [
    "aio-pika",
    "fastapi",
    "asyncpg",
    "alembic",
    "redis",
    "pyjwt",
    "httpx",
    "pyyaml",
    "structlog",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
]

# HTTP-serving services.
web = [
    "aio-pika",
    "fastapi",
    "asyncpg",
    "alembic",
    "redis",
    "pyjwt",
    "httpx",
    "pyyaml",
    "structlog",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
    "uvicorn[standard]",
    "python-multipart",
    "sse-starlette",
    "jinja2",
]

# Background workers.
worker = [
    "aio-pika",
    "fastapi",
    "asyncpg",
    "alembic",
    "redis",
    "pyjwt",
    "httpx",
    "pyyaml",
    "structlog",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
    "arq",
]

# The image PII pipeline worker ONLY. Never the gateway's web image — these
# carry ~500MB of models, and keeping them out is why API instances stay small.
media = [
    "aio-pika",
    "fastapi",
    "asyncpg",
    "alembic",
    "redis",
    "pyjwt",
    "httpx",
    "pyyaml",
    "structlog",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
    "arq",
    "pillow",
    "mediapipe",
    "pytesseract",
    "open-clip-torch",
    "torch",
    "boto3",
]

[tool.setuptools.packages.find]
include = ["faue_core*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["faue_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
